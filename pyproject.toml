[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmarks"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "starlette",
    "uvicorn",
    "asyncpg",
    "sqlalchemy[asyncio]",
    "pydantic[email]",
    "python-dotenv",
    "pyjwt",
    "bcrypt",
    "httpx",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
]
